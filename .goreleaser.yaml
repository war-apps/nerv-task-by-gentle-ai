version: 2

project_name: nerv-task

before:
  hooks:
    - go mod tidy

builds:
  - id: nerv-task
    main: ./cmd/nerv-task
    binary: nerv-task
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/war-apps/nerv-task-by-gentle-ai/internal/version.Binary={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: nerv-task
    ids: [nerv-task]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  disable: true

release:
  mode: append
  name_template: "{{ .Tag }}"
